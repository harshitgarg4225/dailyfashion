<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />

    <!--
      J4, enforced rather than promised.

      `connect-src 'none'` means fetch, XHR, WebSocket and EventSource all fail
      at the browser level. Even if a future dependency tried to phone home, the
      request would be blocked before it left the device — the privacy claim in
      onboarding is a property of the page, not a policy someone has to remember.

      `img-src` allows blob: and data: because that is how the app renders
      photos out of IndexedDB. Neither can reach the network.

      `frame-ancestors` is deliberately absent here — browsers ignore it in a
      meta tag. It is sent as a real header by server.js instead.

      `style-src` carries no 'unsafe-inline': the app sets its one dynamic
      style through the CSSOM, which CSP permits, rather than through a style
      attribute, which it does not.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               connect-src 'none';
               img-src 'self' blob: data:;
               media-src 'self' blob:;
               style-src 'self';
               script-src 'self';
               form-action 'none';
               base-uri 'self'"
    />

    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Fashion" />
    <meta name="description" content="A private log of what you wore and how it went." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!--
      iOS launch images. Without these an installed app flashes white before the
      first paint, which on an ivory interface is a visible jolt every launch.
    -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
    />

    <title>Daily Fashion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
