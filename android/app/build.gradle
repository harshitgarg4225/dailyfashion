apply plugin: 'com.android.application'

/**
 * Release signing, supplied from outside the repository.
 *
 * The APK on the download page is sideloaded rather than installed from Play,
 * so its signature is the only thing tying one build to the next: Android will
 * refuse to update an installed app with a build signed by a different key.
 * That makes the keystore a real asset, and a real asset does not live in a
 * public repository — it comes from CI secrets (see .github/workflows/apk.yml)
 * or, for a local build, from an untracked android/keystore.properties.
 *
 * With neither present the release build is left unsigned rather than silently
 * falling back to the debug key, because a debug-signed APK is debuggable, and
 * a debuggable build of an app whose whole claim is "nothing leaves this phone"
 * would hand its contents to anything that can reach adb.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/*
 * `?:` alone is not enough here, and the difference is not academic: an unset
 * GitHub Actions secret arrives as an empty string rather than as absent, so a
 * null check passes and `file('')` throws — which aborts the whole `android {}`
 * block and surfaces as "project ':app' does not specify compileSdk", a message
 * with no relationship at all to the actual fault.
 */
def setting = { value, envName ->
    def resolved = value ?: System.getenv(envName)
    return resolved?.trim() ? resolved.trim() : null
}

def resolvedStoreFile = setting(keystoreProperties['storeFile'], 'ANDROID_KEYSTORE_PATH')
def resolvedStorePassword = setting(keystoreProperties['storePassword'], 'ANDROID_KEYSTORE_PASSWORD')
def resolvedKeyAlias = setting(keystoreProperties['keyAlias'], 'ANDROID_KEY_ALIAS')
def resolvedKeyPassword = setting(keystoreProperties['keyPassword'], 'ANDROID_KEY_PASSWORD')
def hasSigningConfig = resolvedStoreFile != null && file(resolvedStoreFile).exists()

android {
    namespace = "com.dailyfashion.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dailyfashion.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
